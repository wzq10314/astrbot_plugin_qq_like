name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: JM, PICA and Pixiv regression tests
        run: |
          python scripts/test_jm_chapters.py
          python scripts/test_jm_commands.py
          python scripts/test_jm_llm.py
          python scripts/test_jm_rankings.py
          python scripts/test_jm_search_replies.py
          python scripts/test_pica_llm_results.py
          python scripts/test_pixiv_recovery.py
      - run: python -m unittest discover -s reader -p test_reader.py
      - run: python scripts/build_zip.py
