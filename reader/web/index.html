<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>漫画阅读 · Dantarian</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header class="masthead"><a class="wordmark" href="#top"><span class="mark">D</span>DANTARIAN <span class="wordmark-sub">阅读室</span></a><button id="theme" class="quiet" aria-label="切换深浅主题">◐ <span>深色</span></button></header>
<main id="top">
<section class="intro"><div class="eyebrow"><span></span> YOUR PRIVATE READING SPACE</div><h1 id="title">正在打开阅读页</h1><p id="subtitle">把故事留给这一刻。</p><div class="meta"><span id="count">读取中…</span><span class="dot">·</span><span id="expiry"></span></div></section>
<section class="toolbar" aria-label="阅读设置"><div class="chapter-field"><label for="chapter">章节</label><select id="chapter" aria-label="选择章节"><option>正在加载</option></select></div><div class="mode"><button id="scrollMode" class="selected" aria-pressed="true">连续阅读</button><button id="singleMode" aria-pressed="false">逐页阅读</button></div></section>
<div id="notice" role="status" class="notice" hidden></div>
<div id="galleryInfo" class="gallery-info" hidden><div><strong>PIXIV ORIGINALS</strong><p>保留原始文件 · 无重新编码 · 无尺寸缩放</p></div><a class="download-all" href="originals.zip" download>下载全部原图 ↓</a></div>
<div id="resume" class="resume" hidden><span id="resumeText"></span><button id="resumeButton">继续阅读 →</button></div>
<section id="pages" aria-label="漫画页面" aria-busy="true"></section>
<div id="singleNav" class="single-nav" hidden><button id="prev">← 上一页</button><span id="singlePosition"></span><button id="next">下一页 →</button></div>
<footer><span class="footer-mark">DANTARIAN · 阅读室</span><p>链接有效期内可访问 · 请勿公开转发私人链接</p></footer>
</main>
<nav id="dock" class="dock" aria-label="阅读进度" hidden><span id="position">1 / 1</span><input id="seek" type="range" min="1" value="1" aria-label="跳转到页码"><button id="toTop" aria-label="回到顶部">↑</button></nav>
</body></html>
